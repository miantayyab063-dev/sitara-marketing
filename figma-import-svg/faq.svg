xt x="80" y="815" font-size="23" fill="#153c32">Estimate aur offer mein farq</text><text x="80" y="855" font-size="16" fill="#53665e">Calculator aap ki entered values ko divide karta hai. Actual developer schedule aur additional charges alag </text><text x="80" y="960" font-size="23" fill="#153c32">Inquiry ke baad agla qadam</text><text x="80" y="1000" font-size="16" fill="#53665e">Website inquiry ke liye hai. Booking ya payment se pehle project, seller authority aur written agreement ki </text><text x="80" y="1105" font-size="23" fill="#153c32">Timeline kahan se confirm hogi?</text><text x="80" y="1145" font-size="16" fill="#53665e">Possession date aur delay ki sharaait developer ke written agreement se confirm karein. Is website par koi g</text><rect x="70" y="1320" width="1300" height="110" fill="#e4e8dc"/><text x="100" y="1385" font-size="30" fill="#153c32">Apna agla qadam wazeh karein. +92 335 8033303</text></svg>